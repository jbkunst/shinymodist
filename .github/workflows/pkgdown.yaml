on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: pkgdown

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  repository-projects: read

jobs:
  dev-wasm:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Move rolling dev tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f dev "$GITHUB_SHA"
          git push origin refs/tags/dev --force

      - name: Ensure rolling dev release exists
        run: |
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev               --prerelease               --title "Development build"               --notes "Rolling WebAssembly build from the current main branch."
          fi

      - name: Build WebAssembly library image
        uses: r-wasm/actions/build-rwasm@v3
        with:
          packages: "."
          image-path: ._rwasm
          strip: "demo, doc, examples, help, html, include, tests, vignette"

      - name: Upload WebAssembly assets to dev release
        run: gh release upload dev ._rwasm/* --clobber

  pkgdown:
    needs: dev-wasm
    if: always() && (needs.dev-wasm.result == 'success' || needs.dev-wasm.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Install Shinylive and dev package metadata
        if: github.event_name != 'pull_request'
        shell: Rscript {0}
        run: |
          pak::pak("posit-dev/r-shinylive")

          pkg_path <- find.package("shinymodist", quiet = TRUE)
          if (nzchar(pkg_path)) {
            remove.packages("shinymodist", lib = dirname(pkg_path))
          }

          pak::pak("jbkunst/shinymodist@dev")

      - name: Build pkgdown site
        shell: Rscript {0}
        run: pkgdown::build_site()

      - name: Export live demos
        if: github.event_name != 'pull_request'
        shell: Rscript {0}
        run: |
          demos <- c(
            basic = "Basic input",
            gallery = "Distribution gallery",
            roc = "ROC curve",
            "bayes-beta-binomial" = "Beta-Binomial prior elicitation"
          )

          dir.create("docs/demos", recursive = TRUE, showWarnings = FALSE)

          for (demo in names(demos)) {
            shinylive::export(
              file.path("inst", "examples", demo),
              "docs/demos",
              subdir = demo,
              wasm_packages = TRUE,
              template_params = list(title = unname(demos[[demo]]))
            )
          }

      - name: Deploy site
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'
